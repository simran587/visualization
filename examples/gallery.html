<title>vizcraft — creative charts from the tallest buildings</title>
<style>
  :root { color-scheme: light dark;
    --bg:#f5f6f8; --card:#ffffff; --ink:#15181f; --muted:#5b606b; --hair:#e4e6ea; --accent:#2a78d6; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0f1116; --card:#171a21; --ink:#eef0f4; --muted:#a2a8b4; --hair:#262a33; --accent:#4f9bf0; } }
  :root[data-theme="dark"]{ --bg:#0f1116; --card:#171a21; --ink:#eef0f4; --muted:#a2a8b4; --hair:#262a33; --accent:#4f9bf0; }
  :root[data-theme="light"]{ --bg:#f5f6f8; --card:#ffffff; --ink:#15181f; --muted:#5b606b; --hair:#e4e6ea; --accent:#2a78d6; }
  *{box-sizing:border-box}
  body{margin:0}
  .wrap{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);
    min-height:100vh;padding:40px 24px 80px}
  header{max-width:1000px;margin:0 auto 8px}
  .eyebrow{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
  h1{font-size:clamp(26px,4vw,40px);letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
  .sub{color:var(--muted);max-width:60ch;margin:0}
  .grid{max-width:1000px;margin:28px auto 0;display:flex;flex-direction:column;gap:24px}
  .card{margin:0;background:var(--card);border:1px solid var(--hair);border-radius:14px;
    padding:20px 22px 24px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  figcaption h2{font-size:18px;margin:0 0 2px}
  figcaption p{color:var(--muted);font-size:13.5px;margin:0 0 14px}
  .chart{overflow-x:auto}
  .chart svg{width:100%;height:auto;max-width:100%;display:block;border-radius:8px}
  footer{max-width:1000px;margin:36px auto 0;color:var(--muted);font-size:12.5px;font-family:ui-monospace,monospace}
</style>
