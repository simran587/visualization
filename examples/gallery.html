<title>vizcraft — creative charts from the tallest buildings</title>
<style>
  :root { color-scheme: light dark;
    --bg:#f6f4fb; --card:#ffffff; --ink:#17161f; --muted:#5b5866; --hair:#e7e3f0; --accent:#7c3aed; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#100e17; --card:#17151f; --ink:#f3f1f8; --muted:#a6a2b4; --hair:#2a2735; --accent:#a78bfa; } }
  :root[data-theme="dark"]{ --bg:#100e17; --card:#17151f; --ink:#f3f1f8; --muted:#a6a2b4; --hair:#2a2735; --accent:#a78bfa; }
  :root[data-theme="light"]{ --bg:#f6f4fb; --card:#ffffff; --ink:#17161f; --muted:#5b5866; --hair:#e7e3f0; --accent:#7c3aed; }
  *{box-sizing:border-box} body{margin:0}
  .wrap{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;padding:40px 24px 80px}
  header{max-width:1000px;margin:0 auto 8px}
  .eyebrow{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
  h1{font-size:clamp(26px,4vw,40px);letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
  .sub{color:var(--muted);max-width:62ch;margin:0}
  .grid{max-width:1040px;margin:28px auto 0;display:flex;flex-direction:column;gap:24px}
  .card{margin:0;background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:20px 22px 24px;box-shadow:0 1px 4px rgba(60,20,120,.07)}
  figcaption h2{font-size:18px;margin:0 0 2px}
  figcaption p{color:var(--muted);font-size:13.5px;margin:0 0 14px}
  .chart{overflow-x:auto}
  .chart svg{width:100%;height:auto;max-width:100%;display:block;border-radius:8px}
  footer{max-width:1000px;margin:36px auto 0;color:var(--muted);font-size:12.5px;font-family:ui-monospace,monospace}
</style>
